<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantin Kontainer FakDa - POS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-container" style="max-width: 800px; margin: 40px auto;">
        <h1 style="text-align: center; color: var(--soft-gold); margin-bottom: 30px;">Kantin Kontainer FakDa</h1>
        
        <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px;">
            <!-- Bagian Menu -->
            <div class="glass-container" style="flex: 1; min-width: 250px;">
                <h3 style="margin-top: 0;">Menu Tersedia</h3>
                
                <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong>Bakso</strong><br>
                        <small>Rp 15.000</small>
                    </div>
                    <button class="btn-gold" onclick="addToCart('Bakso', 15000)">Tambah</button>
                </div>
                
                <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong>Indomie</strong><br>
                        <small>Rp 10.000</small>
                    </div>
                    <button class="btn-gold" onclick="addToCart('Indomie', 10000)">Tambah</button>
                </div>
                
                <!-- Placeholder jika nanti ingin menambah gambar produk -->
                <p style="font-size: 12px; color: #888; text-align: center; margin-top: 20px;">
                    *Anda bisa menambahkan tag &lt;img src="fotoproduk/..."&gt; di sini nantinya
                </p>
            </div>

            <!-- Bagian Keranjang -->
            <div class="glass-container" style="flex: 1; min-width: 250px;">
                <h3 style="margin-top: 0;">Keranjang Belanja</h3>
                <div id="cart-items" style="min-height: 80px; margin-bottom: 10px; font-size: 14px; line-height: 1.6;">
                    <i style="color: #888;">Keranjang kosong</i>
                </div>
                
                <hr style="border-color: var(--glass-border); margin: 15px 0;">
                <h3 id="cart-total" style="color: var(--soft-gold); margin: 0 0 20px 0;">Total: Rp 0</h3>
                
                <div style="display: flex; gap: 10px;">
                    <button id="btn-cash" class="btn-gold" style="flex: 1;">Bayar Tunai</button>
                    <button id="btn-qris" class="btn-gold" style="flex: 1;">Bayar QRIS</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
